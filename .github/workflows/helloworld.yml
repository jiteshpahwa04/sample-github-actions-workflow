name: "Hello world workflow"

# Controls when the workflow will run on the main and production branches
# But if we want to run on push on any branch, we can use:
# on:
#     push:
#         branches:
#             - '*'
on:
    push:
        branches:
            - main
            - production

jobs:
    hello_world_job:
        runs-on: ubuntu-latest
        steps:
            - name: "Print Hello World!"
              run: echo "Hello World!"
            - name: "Print current date and time"
              run: date